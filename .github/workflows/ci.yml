name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in index.html css/main.css scripts/main.js favicon.ico; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

      - name: Check that referenced local assets exist
        run: |
          missing=0
          for path in $(grep -oE '(href|src)="[a-zA-Z0-9_./-]+"' index.html | sed -E 's/^(href|src)="//;s/"$//'); do
            case "$path" in
              http://*|https://*|mailto:*|"#"*|"") continue ;;
            esac
            if [ ! -f "$path" ]; then
              echo "::error::index.html references missing file: $path"
              missing=1
            fi
          done
          exit $missing
